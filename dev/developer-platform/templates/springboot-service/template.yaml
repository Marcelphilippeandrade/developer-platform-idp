apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: springboot-service
  title: Spring Boot Service
  description: Create a standard Spring Boot microservice

spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service Information
      required:
        - name
        - owner
        - packageName
      properties:
        name:
          title: Service Name
          type: string
          description: Unique name of the microservice
          ui:autofocus: true

        owner:
          title: Owner
          type: string
          description: Team or squad responsible for the service

        packageName:
          title: Base Package
          type: string
          description: Base Java package (e.g. com.company.payment)

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          packageName: ${{ parameters.packageName }}
          packagePath: ${{ parameters.packageName | replace('.', '/') }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: "Spring Boot service created via Developer Platform"
        repoUrl: github.com?repo=${{ parameters.name }}&owner=Marcelphilippeandrade
        defaultBranch: main

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

  output:
    links:
      - title: Open Docs
        url: https://backstage.io/docs/features/software-templates/
