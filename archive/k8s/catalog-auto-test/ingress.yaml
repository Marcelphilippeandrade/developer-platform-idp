apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: catalog-auto-test-ingress

spec:
  rules:
    - host: catalog-auto-test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalog-auto-test
                port:
                  number: 80
