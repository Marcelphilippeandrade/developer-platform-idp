apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: customer-api-v1-ingress

spec:
  rules:
    - host: customer-api-v1.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-api-v1
                port:
                  number: 80
